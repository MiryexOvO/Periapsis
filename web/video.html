<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Periapsis · 测试视频</title>
<style>body{background:#10151e;color:#e8eef9;font:16px system-ui;max-width:960px;margin:48px auto;padding:0 24px}h1{font-weight:550}canvas{width:100%;background:#06090d;border-radius:12px}button{padding:10px 20px;margin:16px 10px 16px 0;border:0;border-radius:6px;cursor:pointer}#status{color:#9ec8eb}small{color:#a9b5c6}</style>
<h1>Periapsis <small>/ PERI</small></h1><p>测试视频 · 640 × 360 · VP8 · 无音频</p>
<canvas id="screen" width="640" height="360"></canvas>
<div><button id="connect">连接</button><button id="recover" disabled>恢复画面</button><button id="stop" disabled>停止</button></div>
<p id="status" role="status">尚未连接</p><small id="metrics">已显示 0 帧</small>
<script type="module" src="/player.js"></script></html>
