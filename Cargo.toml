[workspace]
members = ["crates/peri-types", "crates/peri-session", "crates/peri-scheduler", "crates/peri-native", "crates/peri-obs", "crates/peri-webtransport", "crates/peri-relay"]
default-members = ["crates/peri-types", "crates/peri-session", "crates/peri-scheduler", "crates/peri-native"]
exclude = ["tools/internal-comparison"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
peri-types = { path = "crates/peri-types" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev.package.ring]
debug = 0
