[package]
name = "peri-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
peri-session = { path = "../peri-session" }
peri-types.workspace = true
moq-net = "=0.3.18"
web-transport-quinn = { version = "=0.13.5", default-features = false, features = ["ring"] }
transport-v5 = { package = "web-transport-trait", version = "=0.5.2" }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std", "sync"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
base64 = "=0.23.1"
sha2 = "=0.11.1"
time = "0.3"
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
