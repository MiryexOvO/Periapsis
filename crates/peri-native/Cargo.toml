[package]
name = "peri-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
peri-types.workspace = true
peri-session = { path = "../peri-session" }
serde.workspace = true
serde_json.workspace = true
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }

[dev-dependencies]
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
