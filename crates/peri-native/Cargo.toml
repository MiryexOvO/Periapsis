[package]
name = "peri-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BSD-3-Clause"
publish.workspace = true

[dependencies]
peri-types.workspace = true
peri-session = { path = "../peri-session" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2 = "0.10"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "io-util", "sync", "signal", "process"] }

subtle = "=2.6.1"
rcgen = "=0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
