[package]
name = "peri-webtransport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
web-transport-quinn = { version = "=0.13.5", default-features = false, features = ["ring"] }
http = "1"
rustls-pki-types = { version = "1", features = ["std"] }
tokio = { version = "1.48", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread","process","fs","signal"] }

peri-native = { path = "../peri-native" }
peri-types.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring","std"] }
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

getrandom = "0.3"
